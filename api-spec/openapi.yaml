openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration and sessions
  - name: barnwise
    description: Profile-owned BarnWise data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Register a BarnWise account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Log in to a BarnWise account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Delete the signed-in account and all owned data
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Account and owned data deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Log out of the current session
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/data:
    get:
      operationId: getMyBarnWiseData
      tags: [barnwise]
      summary: Get the signed-in user's BarnWise data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile-owned BarnWise data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveMyBarnWiseData
      tags: [barnwise]
      summary: Replace the signed-in user's BarnWise data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarnWiseData"
      responses:
        "200":
          description: Saved profile-owned BarnWise data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Username already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    AccountUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, rider]
      required: [id, username, name, role]
    Horse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        breed: { type: string }
        birthYear: { type: string }
        sex:
          type: string
          enum: [Merrie, Ruin, Hengst]
        coat: { type: string }
        notes: { type: string }
      required: [id, name, breed, birthYear, sex, coat, notes]
    HorseEntry:
      type: object
      properties:
        id: { type: string }
        horseId: { type: string }
        kind:
          type: string
          enum: [ride, training, care, health, appointment]
        title: { type: string }
        date: { type: string }
        detail: { type: string }
        status:
          type: string
          enum: [planned, completed]
      required: [id, horseId, kind, title, date, detail, status]
    BarnWiseProfile:
      type: object
      properties:
        name: { type: string }
        role:
          type: string
          enum: [owner, rider]
      required: [name, role]
    BarnWiseData:
      type: object
      properties:
        horses:
          type: array
          items: { $ref: "#/components/schemas/Horse" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/HorseEntry" }
        profile:
          $ref: "#/components/schemas/BarnWiseProfile"
      required: [horses, entries, profile]
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 80
        role:
          type: string
          enum: [owner, rider]
        data:
          $ref: "#/components/schemas/BarnWiseData"
      required: [username, password, role]
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
      required: [username, password]
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required: [currentPassword, newPassword]
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AccountUser"
        data:
          $ref: "#/components/schemas/BarnWiseData"
      required: [token, user, data]
    DataEnvelope:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AccountUser"
        data:
          $ref: "#/components/schemas/BarnWiseData"
      required: [user, data]

